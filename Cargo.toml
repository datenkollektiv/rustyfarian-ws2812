[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
authors = ["datenkollektiv"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/datenkollektiv/rustyfarian-ws2812"

[workspace.dependencies]
# External dependencies
anyhow = "1.0"
rgb = "0.8"
smart-leds-trait = { version = "^0.3.2", default-features = false }
smart-leds = "0.4.0"

# Internal crates
ferriswheel = { path = "crates/ferriswheel" }
led-effects = { path = "crates/led-effects" }
ws2812-pure = { path = "crates/ws2812-pure" }

# ESP32 dependencies
esp-idf-hal = { version = "0.46", features = ["rmt-legacy"] }
# Pinned to exact 1.0.0: the "unstable" feature gate covers RMT and the GPIO
# matrix APIs we rely on; patch bumps can break that surface silently.
# Chip selection and "unstable" are forwarded via features in the driver crate.
esp-hal = { version = "1.0.0" }
# App descriptor required for IDF bootloader compatibility; chip feature forwarded from driver crate.
esp-bootloader-esp-idf = { version = "0.4.0", default-features = false }
# Bare-metal serial output via USB-JTAG ROM; no esp-hal dependency.
esp-println = { version = "0.16", default-features = false }
