[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but pulled in transitively by
    # esp-hal 1.0.0 and riscv 0.15.0. No upstream fix is available; the risk
    # is negligible for a proc-macro crate with no unsafe runtime code.
    { id = "RUSTSEC-2024-0436", reason = "transitively required by esp-hal 1.0.0 / riscv 0.15.0; no safe upgrade available upstream" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
