[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436). esp-hal 1.1.2 depends on it
    # *directly*, and it also arrives transitively via riscv 0.15.0. Bumping
    # riscv alone therefore cannot clear this — esp-hal must drop paste first.
    # Risk is negligible: proc-macro crate, no unsafe runtime code.
    # Re-evaluate after each esp-hal bump with `cargo tree -i paste`
    # (re-checked 2026-08-12 against esp-hal 1.1.2: still a direct dependency).
    { id = "RUSTSEC-2024-0436", reason = "direct dependency of esp-hal 1.1.2 and transitive via riscv 0.15.0; no safe upgrade available upstream" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
