[package]
name = "rustyfarian-esp-idf-ws2812"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using ESP-IDF RMT peripheral"
readme = "README.md"
documentation = "https://github.com/datenkollektiv/rustyfarian-ws2812/blob/main/crates/rustyfarian-esp-idf-ws2812/README.md"
keywords = ["ws2812", "neopixel", "esp-idf", "rmt", "led"]
categories = ["embedded", "hardware-support"]

[package.metadata.docs.rs]
targets = ["riscv32imac-esp-espidf"]

[build-dependencies]
embuild = "=0.33.1"

[dev-dependencies]
ferriswheel = { workspace = true }

[dependencies]
# Pure no_std crates — compile for any target.
pennant = { workspace = true, optional = true }
rgb.workspace = true
smart-leds-trait = { workspace = true, default-features = false }
smart-leds = { workspace = true, optional = true }
bunting.workspace = true

# ESP-IDF-specific dependencies.  Only compiled when target_os = "espidf"
# (i.e. the riscv32imac-esp-espidf / riscv32imc-esp-espidf target triples).
# Keeping them out of the bare-metal dep graph prevents esp-idf-sys's build
# script from running — and hard-failing — when IDE tooling uses the default
# riscv32imac-unknown-none-elf target.
[target.'cfg(target_os = "espidf")'.dependencies]
anyhow.workspace = true
esp-idf-hal.workspace = true

[features]
default = ["pennant"]
pennant = ["dep:pennant"]
# Enables pennant's `hal` feature so examples can use the GPIO LED adapters
# (e.g. `RgbGpioLed`). Example-only; not part of the default driver surface.
rgb-gpio = ["pennant", "pennant/hal"]
smart-leds = ["dep:smart-leds"]

[[example]]
name = "idf_c3_rainbow"

[[example]]
name = "idf_c6_rainbow"

[[example]]
name = "idf_esp32_rainbow"

[[example]]
name = "idf_esp32_rgb_cycle"
required-features = ["rgb-gpio"]

[[example]]
name = "idf_c6_breathe_color"

[[example]]
name = "idf_c6_effects"

[[example]]
name = "idf_c6_meteor"

[[example]]
name = "idf_c6_twinkle"

[[example]]
name = "idf_c6_cylon"

[[example]]
name = "idf_c6_rainbow_comet"

[[example]]
name = "idf_c6_knight_rider"

[[example]]
name = "idf_c6_fire"

[[example]]
name = "idf_c6_smart_leds"
required-features = ["smart-leds"]
