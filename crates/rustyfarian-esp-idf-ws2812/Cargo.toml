[package]
name = "rustyfarian-esp-idf-ws2812"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using ESP-IDF RMT peripheral"
readme = "README.md"
documentation = "https://docs.rs/rustyfarian-esp-idf-ws2812"
keywords = ["ws2812", "neopixel", "esp-idf", "rmt", "led"]
categories = ["embedded", "hardware-support"]

[build-dependencies]
embuild = "=0.33.1"

[dev-dependencies]
ferriswheel = { workspace = true }

[dependencies]
anyhow.workspace = true
esp-idf-hal.workspace = true
pennant = { workspace = true, optional = true }
rgb.workspace = true
smart-leds-trait = { workspace = true, default-features = false }
smart-leds = { workspace = true, optional = true }
bunting.workspace = true

[features]
default = ["pennant"]
pennant = ["dep:pennant"]
smart-leds = ["dep:smart-leds"]

[[example]]
name = "idf_c3_rainbow"

[[example]]
name = "idf_c6_rainbow"

[[example]]
name = "idf_esp32_rainbow"

[[example]]
name = "idf_c6_breathe_color"

[[example]]
name = "idf_c6_effects"

[[example]]
name = "idf_c6_meteor"

[[example]]
name = "idf_c6_twinkle"

[[example]]
name = "idf_c6_cylon"

[[example]]
name = "idf_c6_rainbow_comet"

[[example]]
name = "idf_c6_knight_rider"

[[example]]
name = "idf_c6_fire"

[[example]]
name = "idf_c6_smart_leds"
required-features = ["smart-leds"]
