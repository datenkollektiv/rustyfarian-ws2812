[package]
name = "rustyfarian-esp-hal-ws2812"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using esp-hal RMT peripheral (bare-metal, no_std)"
keywords = ["ws2812", "neopixel", "esp-hal", "rmt", "led"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
esp-hal.workspace = true
rgb.workspace = true
ws2812-pure.workspace = true
led-effects = { workspace = true, optional = true }

[features]
default = ["esp32c6", "unstable", "led-effects"]
esp32c6 = ["esp-hal/esp32c6"]
unstable = ["esp-hal/unstable"]
led-effects = ["dep:led-effects"]
