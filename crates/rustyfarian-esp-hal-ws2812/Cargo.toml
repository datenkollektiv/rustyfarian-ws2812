[package]
name = "rustyfarian-esp-hal-ws2812"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using esp-hal RMT peripheral (bare-metal, no_std)"
keywords = ["ws2812", "neopixel", "esp-hal", "rmt", "led"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
esp-hal.workspace = true
esp-bootloader-esp-idf.workspace = true
rgb.workspace = true
ws2812-pure.workspace = true
smart-leds-trait = { workspace = true, default-features = false }
led-effects = { workspace = true, optional = true }
smart-leds = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }

[dev-dependencies]
ferriswheel = { workspace = true }
# esp-println is used only in hal_c6_pulse.rs; the esp32c6 feature is intentional.
# Other examples (c3, esp32) do not import esp_println, so this does not affect them.
esp-println = { workspace = true, features = ["esp32c6", "jtag-serial"] }

[features]
default = ["esp32c6", "unstable", "led-effects"]
esp32c6 = ["esp-hal/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-rtos?/esp32c6"]
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-rtos?/esp32c3"]
esp32   = ["esp-hal/esp32",   "esp-bootloader-esp-idf/esp32",   "esp-rtos?/esp32"]
unstable = ["esp-hal/unstable"]
led-effects = ["dep:led-effects"]
smart-leds = ["dep:smart-leds"]
rt = ["esp-hal/rt"]
async = ["dep:esp-rtos", "dep:embassy-time", "dep:embassy-executor", "esp-hal/unstable", "esp-rtos/embassy"]

[[example]]
name = "hal_c3_pulse"
required-features = ["esp32c3", "rt"]

[[example]]
name = "hal_c6_pulse"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_esp32_pulse"
required-features = ["esp32", "rt"]

[[example]]
name = "hal_c6_breathe_color"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_meteor"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_twinkle"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_cylon"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_rainbow_comet"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_knight_rider"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_fire"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_smart_leds"
required-features = ["esp32c6", "rt", "smart-leds"]

[[example]]
name = "hal_c6_rainbow_comet_async"
required-features = ["esp32c6", "rt", "async"]

[[example]]
name = "hal_c3_pulse_async"
required-features = ["esp32c3", "rt", "async"]

[[example]]
name = "hal_c6_pulse_async"
required-features = ["esp32c6", "rt", "async"]

[[example]]
name = "hal_esp32_pulse_async"
required-features = ["esp32", "rt", "async"]
