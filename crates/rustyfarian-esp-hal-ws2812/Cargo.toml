[package]
name = "rustyfarian-esp-hal-ws2812"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
# Above the workspace floor (1.88): esp-hal 1.2 and esp-rtos 0.4 declare rust-version 1.95.
# The floor itself is bounded by the AVR nightly — see the root Cargo.toml.
# `check-hal-xtensa` builds this crate with the espup `esp` toolchain, which must therefore
# report a numeric version >= 1.95.0 (Cargo ignores the `-nightly` suffix). Local: 1.95.0.0;
# CI pin: 1.97.0.0. An espup toolchain below 1.95 fails here with "not supported by the
# following package", exactly like the AVR case.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using esp-hal RMT peripheral (bare-metal, no_std)"
readme = "README.md"
documentation = "https://docs.rs/rustyfarian-esp-hal-ws2812"
keywords = ["ws2812", "neopixel", "esp-hal", "rmt", "led"]
categories = ["embedded", "hardware-support", "no-std"]

[package.metadata.docs.rs]
targets = ["riscv32imac-unknown-none-elf"]
features = ["esp32c6", "unstable"]

[dependencies]
esp-hal.workspace = true
esp-bootloader-esp-idf.workspace = true
rgb.workspace = true
bunting.workspace = true
smart-leds-trait = { workspace = true, default-features = false }
pennant = { workspace = true, optional = true }
smart-leds = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
esp-println = { workspace = true, optional = true, default-features = false, features = ["jtag-serial"] }

[dev-dependencies]
ferriswheel = { workspace = true }

[features]
default = ["esp32c6", "unstable", "pennant"]
esp32c6 = ["esp-hal/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-rtos?/esp32c6", "esp-println?/esp32c6"]
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-rtos?/esp32c3", "esp-println?/esp32c3"]
esp32   = ["esp-hal/esp32",   "esp-bootloader-esp-idf/esp32",   "esp-rtos?/esp32",   "esp-println?/esp32"]
unstable = ["esp-hal/unstable"]
pennant = ["dep:pennant"]
smart-leds = ["dep:smart-leds"]
rt = ["esp-hal/rt"]
esp-println = ["dep:esp-println"]
async = ["dep:esp-rtos", "dep:embassy-time", "dep:embassy-executor", "dep:embassy-sync", "esp-hal/unstable", "esp-rtos/embassy"]

[[example]]
name = "hal_c3_pulse"
required-features = ["esp32c3", "rt"]

[[example]]
name = "hal_c6_pulse"
required-features = ["esp32c6", "rt"]

# Regression guard for the historic GPIO8 transmit hang — see the example's
# module docs and docs/project-lore.md. Drives the onboard LED, no wiring needed.
[[example]]
name = "hal_c6_onboard_pulse"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_esp32_pulse"
required-features = ["esp32", "rt"]

[[example]]
name = "hal_c6_breathe_color"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_meteor"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_twinkle"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_cylon"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_rainbow_comet"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_knight_rider"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_fire"
required-features = ["esp32c6", "rt"]

[[example]]
name = "hal_c6_smart_leds"
required-features = ["esp32c6", "rt", "smart-leds"]

[[example]]
name = "hal_c6_rainbow_comet_async"
required-features = ["esp32c6", "rt", "async"]

[[example]]
name = "hal_c3_pulse_async"
required-features = ["esp32c3", "rt", "async"]

[[example]]
name = "hal_c6_pulse_async"
required-features = ["esp32c6", "rt", "async"]

[[example]]
name = "hal_esp32_pulse_async"
required-features = ["esp32", "rt", "async"]

[[example]]
name = "hal_c6_multitask_async"
required-features = ["esp32c6", "rt", "async", "esp-println"]
