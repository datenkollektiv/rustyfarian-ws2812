[package]
name = "rustyfarian-avr-ws2812"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WS2812 (NeoPixel) LED driver using SPI prerendered encoding (no_std, embedded-hal 1.0)"
readme = "README.md"
documentation = "https://docs.rs/rustyfarian-avr-ws2812"
keywords = ["ws2812", "neopixel", "avr", "spi", "led"]
categories = ["embedded", "hardware-support", "no-std"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# SPI prerendered backend is always available (no feature gate) — preserves the
# v0.1.x API surface for existing users.
# Opt-in additions:
bitbang = []
smart-leds-trait = ["dep:smart-leds-trait"]

[dependencies]
bunting.workspace = true
embedded-hal.workspace = true
rgb.workspace = true
smart-leds-trait = { workspace = true, optional = true }

# No avr-device dependency: the bit-bang backend disables global interrupts via
# raw `cli` + `SREG` save/restore inline asm in `bitbang_avr.rs`. This avoids
# pulling in the deprecated `bare-metal` crate (RUSTSEC-2026-0110) transitively.
