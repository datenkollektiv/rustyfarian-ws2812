[package]
name = "pennant"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable LED animation effects for embedded projects"
documentation = "https://docs.rs/pennant"
readme = "README.md"
keywords = ["led", "animation", "embedded", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = []
hal = ["dep:embedded-hal"]

[dependencies]
embedded-hal = { version = "1", optional = true }
rgb.workspace = true
