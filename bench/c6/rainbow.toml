# Rainbow across the 12-LED ring (GPIO18), ESP-IDF driver (`idf_c6_rainbow`).
# Unattended: a 60 s soak that fails on a crash. Attended: watch for 60 s, then one question.
examples = ["idf_c6_rainbow"]

[[step]]
say = "Wait for the app to start"
expect = "app_main"
timeout = 15
optional = true
arm = false       # the IDF boot log is printed during the reset, before the step

[[step]]
say = "Soak for 60 s; the board must stay up and print no crash"
duration = 60
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Watch the ring: a rainbow rotates smoothly around all 12 LEDs"
duration = 60   # maintenance-plan.md: a continuous 60 s run; Enter ends it early
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'  # attended step right after the reset in --attended runs: reads the boot banner, so reject_reboot is left out
attended = true
arm = false

[[step]]
say = "Answer for the whole watch"
confirm = "The rainbow covered all 12 LEDs and rotated smoothly for the whole watch, no stutter, flicker or dark LED?"
