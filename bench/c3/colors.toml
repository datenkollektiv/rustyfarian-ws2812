# The whole 12-LED ring in one solid colour at a time, 3 s each, forever: red, green, blue, white, off.
# Unattended: the log proves one cycle in order. Attended: watch for 60 s (four cycles), then one question.
# Both tiers print the same lines, so the steps are shared: hal first, then the idf twin.
examples = ["hal_c3_colors", "idf_c3_colors"]

[[step]]
say = "Wait for the banner"
expect = "(hal|idf)_c3_colors: 12 LEDs on GPIO4"
timeout = 10
optional = true
arm = false       # the banner is printed during the reset, before the step

[[step]]
say = "The log must show one full cycle in order: red, green, blue, white, off"
expect = ["showing RED", "showing GREEN", "showing BLUE", "showing WHITE", "showing OFF"]
reject = 'FAIL|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 35   # up to one cycle until the next red, plus the 12 s to reach off
arm = false

[[step]]
say = "Watch the ring: red, green, blue, white, dark, 3 s each, on all 12 LEDs"
duration = 60   # maintenance-plan.md: a continuous 60 s run; Enter ends it early
reject = 'FAIL|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
attended = true
arm = false

[[step]]
say = "Answer for the whole watch"
confirm = "Every cycle showed red, green, blue, white, dark in that order, every LED lit in every colour, none flickering or different?"
