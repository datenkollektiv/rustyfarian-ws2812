# Blue pulse on the 12-LED ring (GPIO4): blocking driver, the async twin, then the ESP-IDF twin.
# Unattended: a 60 s soak that fails on a crash. Attended: watch for 60 s, then one question.
examples = ["hal_c3_pulse", "hal_c3_pulse_async", "idf_c3_pulse"]

[[step]]
say = "Soak for 60 s; the board must stay up and print no crash"
duration = 60
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'  # reads the boot banner: first step after the reset, so reject_reboot is left out
arm = false

[[step]]
say = "Watch the ring: all 12 LEDs breathe blue together, dark to dim and back"
duration = 60   # maintenance-plan.md: a continuous 60 s run; Enter ends it early
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'  # attended step right after the reset in --attended runs: reads the boot banner, so reject_reboot is left out
attended = true
arm = false

[[step]]
say = "Answer for the whole watch"
confirm = "All 12 LEDs pulsed blue in sync for the whole watch, none stuck, flickering, flashing or off-colour?"
