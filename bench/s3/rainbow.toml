# Rainbow across the 5-LED ring (GPIO48), ESP-IDF driver (`idf_s3_rainbow`).
# Unattended: a 60 s soak that fails on a crash. Attended: watch for 60 s, then one question.
examples = ["idf_s3_rainbow"]

[[step]]
say = "Wait for the app to start"
expect = "app_main"
timeout = 15
optional = true
arm = false       # the IDF boot log is printed during the reset, before the step

[[step]]
say = "Soak for 60 s; the board must stay up and print no crash"
duration = 60
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'
arm = false

[[step]]
say = "Watch the ring: a rainbow rotates smoothly around all 5 LEDs"
duration = 60   # maintenance-plan.md: a continuous 60 s run; Enter ends it early
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'
attended = true
arm = false

[[step]]
say = "Answer for the whole watch"
confirm = "The rainbow covered all 5 LEDs and rotated smoothly for the whole watch, no stutter, flicker or dark LED?"
