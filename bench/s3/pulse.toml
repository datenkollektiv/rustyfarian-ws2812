# Blue pulse on the 5-LED ring (GPIO48): blocking driver, then the async twin.
# Unattended: a 60 s soak that fails on a crash. Attended: watch for 60 s, then one question.
examples = ["hal_s3_pulse", "hal_s3_pulse_async"]

[[step]]
say = "Soak for 60 s; the board must stay up and print no crash"
duration = 60
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'
arm = false

[[step]]
say = "Watch the ring: all 5 LEDs breathe blue together, dark to dim and back"
duration = 60   # maintenance-plan.md: a continuous 60 s run; Enter ends it early
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|WDT'
attended = true
arm = false

[[step]]
say = "Answer for the whole watch"
confirm = "All 5 LEDs pulsed blue in sync for the whole watch, none stuck, flickering, flashing or off-colour?"
