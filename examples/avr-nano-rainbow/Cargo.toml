[package]
name = "avr-nano-rainbow"
version = "0.0.0"
edition = "2021"
publish = false
# `cargo run` and `just flash-avr-example` go to the bit-bang rainbow (src/main.rs).
# Other bins (`spi_rainbow`, `bitbang_demo`, `bitbang_spike`) need explicit `--bin` flags.
default-run = "avr-nano-rainbow"

[dependencies]
panic-halt = "1.0"
avr-device = "0.8.1"
embedded-hal = "1.0"
rgb = "0.8"

[dependencies.arduino-hal]
git = "https://github.com/Rahix/avr-hal"
features = ["arduino-nano"]

[dependencies.rustyfarian-avr-ws2812]
path = "../../crates/rustyfarian-avr-ws2812"
features = ["bitbang"]

[dependencies.ws2812-pure]
path = "../../crates/ws2812-pure"

[dependencies.ferriswheel]
path = "../../crates/ferriswheel"

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
