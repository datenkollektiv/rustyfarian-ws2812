[package]
name = "avr-nano-rainbow"
version = "0.0.0"
edition = "2021"
publish = false
# `cargo run` and `just flash-avr-example` go to the bit-bang rainbow (src/main.rs).
# Other bins (`spi_rainbow`, `bitbang_demo`, `bitbang_spike`) need explicit `--bin` flags.
default-run = "avr-nano-rainbow"

[dependencies]
panic-halt = "1.0"
avr-device = "0.8.1"
embedded-hal = "1.0"
rgb = "0.8"

[dependencies.arduino-hal]
git = "https://github.com/Rahix/avr-hal"
# Pinned to the same commit the official avr-hal-template generates. avr-hal publishes
# nothing to crates.io and ships no tags or releases, so a commit SHA is the only ref
# available. Bump deliberately; `Cargo.lock` is committed alongside, and the weekly
# "AVR upstream early warning" workflow builds against upstream main to flag drift.
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

[dependencies.rustyfarian-avr-ws2812]
path = "../../crates/rustyfarian-avr-ws2812"
features = ["bitbang"]

[dependencies.bunting]
path = "../../crates/bunting"

[dependencies.ferriswheel]
path = "../../crates/ferriswheel"

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
