name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny (licenses, advisories, bans)
        run: just deny

      - name: Check pure crates
        run: just check

      - name: Test pure crates
        run: just test

      - name: Check ferriswheel smart-leds-compat (rgb version divergence guard)
        run: just check-ferriswheel-smart-leds-compat

      - name: Test pennant hal feature (SimpleLed adapter — off by default)
        run: just test-pennant-hal
