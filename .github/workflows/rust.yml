name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check pure crates
        shell: bash
        run: |
          host_target="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo check -p ws2812-pure -p ferriswheel -p led-effects --target "${host_target}"

      - name: Test pure crates
        shell: bash
        run: |
          host_target="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo test -p ws2812-pure -p ferriswheel -p led-effects --target "${host_target}"

      - name: Check ferriswheel smart-leds-compat (rgb version divergence guard)
        shell: bash
        run: |
          host_target="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo check -p ferriswheel --features smart-leds-compat --target "${host_target}"
