name: Cross-target Xtensa

# Gates the bare-metal esp-hal driver on the Xtensa ESP32 (WROOM-32) target.
# This is the most expensive of the three jobs — it installs the Xtensa Rust fork
# via espup — hence the path filter and the toolchain cache.
#
# ROLE: this is a compile gate for *our source*, and a forward-compatibility canary for
# the *toolchain*. The distinction matters when it goes red:
#   - red after a change to this repo  -> treat as a normal blocking failure
#   - red with no relevant source change -> upstream toolchain moved; investigate before
#     assuming the PR is at fault, and consider pinning back to 1.95.0.0
#
# Toolchain pin: 1.97.0.0 (current latest), which matches what an unpinned
# `just setup esp` installs locally, so CI and a fresh dev environment agree. Note this is
# ahead of 1.95.0.0, the version the August 2026 esp-hal bump was hardware-validated
# against — see docs/features/archive/esp-hal-stack-upgrade-august-2026-v1.md. Green here
# means "compiles under the current toolchain", NOT "hardware-validated stack".

# NOTE: the push and pull_request `paths:` lists below are duplicated and must stay in
# sync. GitHub Actions does not support YAML anchors/aliases, so this cannot be factored out.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-ws2812/**"
      - "crates/bunting/**"
      - "crates/pennant/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "justfile"
      - ".github/workflows/cross-target-xtensa.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-ws2812/**"
      - "crates/bunting/**"
      - "crates/pennant/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "justfile"
      - ".github/workflows/cross-target-xtensa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-xtensa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XTENSA_VERSION: "1.97.0.0"

jobs:
  xtensa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the Xtensa Rust fork for esp32 and esp32s3 (not the RISC-V or S2 targets).
      # rust-src comes with it, so -Z build-std=core needs no extra step. The version stays in
      # the toolchain cache key (inside the action) — scripts/xtensa-toolchain.sh hard-fails
      # when it finds more than one version under ~/.rustup/toolchains/esp/xtensa-esp-elf/*.
      - name: Setup Xtensa toolchain
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          buildtargets: esp32,esp32s3

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache sees the default rustc, not the esp toolchain, so the pin is part of the key.
          key: xtensa-${{ env.XTENSA_VERSION }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run just ci-xtensa
        run: just ci-xtensa
