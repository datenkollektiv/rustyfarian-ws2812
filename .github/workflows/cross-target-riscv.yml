name: Cross-target RISC-V

# Gates the bare-metal esp-hal driver on both RISC-V configurations:
# ESP32-C6/H2 (riscv32imac, with atomics) and ESP32-C3 (riscv32imc, no atomics).
# Path-filtered: only runs when the driver crate, workspace manifest or the `ci-*` recipes change.

# NOTE: the push and pull_request `paths:` lists below are duplicated and must stay in
# sync. GitHub Actions does not support YAML anchors/aliases, so this cannot be factored out.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-ws2812/**"
      - "crates/bunting/**"
      - "crates/pennant/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-riscv.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-ws2812/**"
      - "crates/bunting/**"
      - "crates/pennant/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-riscv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-riscv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  riscv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `just ci-riscv` adds both RISC-V targets itself, so the toolchain step needs no `targets:`.
      - name: Setup Rust and just
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-rust-just@v1
        with:
          toolchain: stable
          cache-key: riscv

      # Coverage note: check-hal is a library-only check of the default (C6) feature set.
      # check-hal-c3 runs twice — library, then `--examples` with `rt` enabled, so it also
      # compiles hal_c3_pulse. check-hal-async covers the `async` feature on C6 and C3 and
      # compiles the *_async examples with `embassy,rt`. Examples requiring features that are
      # off are skipped by Cargo rather than failing.
      - name: Run just ci-riscv
        run: just ci-riscv
