name: Cross-target AVR

# Gates the AVR driver on the real avr-none target. Two layers:
#   1. cargo check of the driver crate (both SPI and bit-bang backends)
#   2. a real linked build of the example package — the driver crate is lib-only,
#      so nothing links until the example binaries are built, and the AVR linker,
#      target-cpu and ABI are only exercised there.
# Path-filtered: only runs when the AVR driver, its example, the manifest or the `ci-*` recipes change.

# NOTE: the push and pull_request `paths:` lists below are duplicated and must stay in
# sync. GitHub Actions does not support YAML anchors/aliases, so this cannot be factored out.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-avr-ws2812/**"
      - "examples/avr-nano-rainbow/**"
      - "crates/bunting/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "justfile"
      - ".github/workflows/cross-target-avr.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-avr-ws2812/**"
      - "examples/avr-nano-rainbow/**"
      - "crates/bunting/**"
      - "crates/ferriswheel/**"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "justfile"
      - ".github/workflows/cross-target-avr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-avr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  avr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # setup-avr installs avr-gcc (needed for the libgcc 32-bit multiply intrinsics) and the
      # pinned nightly. Keep the toolchain in lockstep with `avr_nightly` in the justfile.
      - name: Setup AVR toolchain
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-avr@v1
        with:
          toolchain: nightly-2025-04-27

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: avr-nightly-2025-04-27

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run just ci-avr
        run: just ci-avr
